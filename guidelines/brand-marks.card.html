<!-- @dsCard group="Brand" viewport="700x160" name="Official mark & app icon" subtitle="EX flight-trails monogram, app icon, and aerofoil diagram mark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);display:flex;flex-wrap:wrap;gap:var(--sp-5);padding:var(--sp-5);background:var(--surface-app);align-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2)}
  .tile{height:72px;display:flex;align-items:center;justify-content:center;padding:0 var(--sp-3);border-radius:var(--radius)}
  .carbon{background:var(--ex-carbon-950)}
  .vapor{background:var(--ex-vapor-50)}
  .mark{width:150px;height:auto}
  .icon{width:72px;height:72px}
  .aero{width:100px}
  .n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-muted)}
</style></head>
<body>
  <div class="cell"><div class="tile vapor"><img class="mark" src="../assets/logo-mark.svg" alt="Exopter EX monogram"></div><span class="n">official mark</span></div>
  <div class="cell"><div class="tile carbon"><img class="mark" src="../assets/logo-mark-white.svg" alt="Exopter EX monogram in white"></div><span class="n">white on carbon</span></div>
  <div class="cell"><div class="tile"><img class="icon" src="../assets/app-icon.svg" alt="Exopter app icon"></div><span class="n">app icon</span></div>
  <div class="cell"><div class="tile"><img class="aero" src="../assets/mark-aerofoil.svg" alt="Aerofoil diagram"></div><span class="n">aerofoil · diagrams</span></div>
</body></html>
