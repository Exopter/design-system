<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillage Flight</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="Hud.css?v=4">
<link rel="icon" href="../../assets/app-icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-app); font-family: var(--font-ui); }
  #app { height: 100vh; }
  .subtabs { display: flex; gap: 2px; padding: 10px 24px 0; background: var(--surface-app); border-bottom: 1px solid var(--border-rule); }
  .subtab { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); background: transparent; border: none; cursor: pointer; padding: 10px 14px; border-bottom: 2px solid transparent; }
  .subtab[data-active="true"] { color: var(--text-strong); border-bottom-color: var(--ex-aqua-500); }
  .subtab:hover:not([data-active="true"]) { color: var(--text-body); }
  .subtab:focus-visible, .shell-room-button:focus-visible, .shell-home-link:focus-visible,
  .signal-status-link:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .signal-status-link { display: inline-flex; padding: 0; border: 0; border-radius: var(--radius-compact); background: transparent; cursor: pointer; }
  .signal-status-link:hover .exds-badge { filter: brightness(1.08); }
  input[type=range] { cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script src="../../dist/ui-kits/os-flight.js"></script>
</body>
</html>
